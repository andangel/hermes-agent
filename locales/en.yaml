    reset_info_1: Messaging sessions (Telegram, Discord, etc.) accumulate context
      over time.
    reset_info_2: Each message adds to the conversation history, which means growing
      API costs.
    reset_info_3: To manage this, sessions can automatically reset after a period
      of inactivity
    reset_info_4: or at a fixed time each day. When a reset happens, the agent saves
      important
    reset_info_5: things to its persistent memory first — but the conversation context
      is cleared.
    reset_manual_hint: You can also manually reset anytime by typing /reset in chat.
    reset_mode_both: Inactivity + daily reset (recommended - reset whichever comes
      first)
    reset_mode_idle: Inactivity only (reset after N minutes of no messages)
    reset_mode_daily: Daily only (reset at a fixed hour each day)
    reset_mode_none: Never auto-reset (context lives until /reset or context compression)
